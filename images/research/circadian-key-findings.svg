<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">What stronger light forcing changes</title><desc id="desc">Across the tested twenty volume–forcing cases, stronger forcing increases correlation primarily by enlarging the repeatable response, with little change in waveform shape and a volume-dependent residual response. A separate geometric decomposition associates 95.7–98.6 percent of residual protein variance with position along a fitted curve. Within periodic LNA, mRNA-associated reaction channels contribute approximately 85 percent of predicted residual protein variance. These are distinct decompositions and their percentages should not be compared as the same quantity.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#172C3C"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#566B78"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#087F8C"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#705BA5"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#C48317"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#C85B47"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#386A9F"/></marker></defs><rect width="1600" height="1000" fill="#FFFFFF"/><text x="70" y="48" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#087F8C" letter-spacing="2">FINDINGS · INTERPRETATION</text><text x="70" y="106" font-family="DejaVu Sans, Arial, sans-serif" font-size="43" font-weight="600" text-anchor="start" fill="#172C3C" >What stronger light forcing changes</text><text x="70" y="151" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#566B78" >A larger repeatable response explains most of the increase in protein–light correlation.</text><rect x="70" y="200" width="1460" height="280" rx="22" fill="#EAF5F5" stroke="none" stroke-width="1"/><text x="110" y="240" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#087F8C" letter-spacing="1.5">REPEATABLE RESPONSE</text><path d="M115,358 L305,358" fill="none" stroke="#CBD5DA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M115.00,374.94 L116.90,373.35 L118.80,371.70 L120.70,370.00 L122.60,368.25 L124.50,366.46 L126.40,364.63 L128.30,362.78 L130.20,360.92 L132.10,359.04 L134.00,357.15 L135.90,355.27 L137.80,353.40 L139.70,351.55 L141.60,349.72 L143.50,347.93 L145.40,346.17 L147.30,344.46 L149.20,342.81 L151.10,341.21 L153.00,339.69 L154.90,338.23 L156.80,336.85 L158.70,335.56 L160.60,334.35 L162.50,333.24 L164.40,332.23 L166.30,331.31 L168.20,330.50 L170.10,329.81 L172.00,329.22 L173.90,328.74 L175.80,328.38 L177.70,328.14 L179.60,328.02 L181.50,328.01 L183.40,328.12 L185.30,328.35 L187.20,328.70 L189.10,329.17 L191.00,329.74 L192.