348.4560160750135" cy="721.0397206996164" r="5" fill="#386A9F" stroke="none" stroke-width="1" opacity="1"/><circle cx="244.79077136009948" cy="763.8421841560554" r="5" fill="#386A9F" stroke="none" stroke-width="1" opacity="1"/><circle cx="155.41190385938052" cy="754.361591263541" r="5" fill="#386A9F" stroke="none" stroke-width="1" opacity="1"/><circle cx="143.08216072403843" cy="703.578001070864" r="5" fill="#386A9F" stroke="none" stroke-width="1" opacity="1"/><path d="M333.79034337630003,728.6487023039142 L368.7906611484097,743.4465993116429" fill="none" stroke="#C85B47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow-coral)"/><text x="147" y="608" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#087F8C" >Along curve</text><text x="295" y="782" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#C85B47" >Off curve</text><text x="405" y="655" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="600" text-anchor="start" fill="#087F8C" >95.7–98.6%</text><text x="405" y="697" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#172C3C" >of residual protein variance</text><text x="405" y="730" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#172C3C" >is associated with position</text><text x="405" y="763" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#172C3C" >along the fitted curve.</text><text x="105" y="838" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#566B78" >Protein variance decomposition; not phase-coordinate variance.</text><text x="850" y="623" font-family="DejaVu Sans, Arial, sans-serif" font-size="45" font-weight="600" text-anchor="start" fill="#705BA5" >≈85%</